name: "Delete HackerOne membership join/remove emails"
description: "Trash messages flagged by the 'HackerOne: Sentry organization membership notification' detection rule, noise-reduction."
type: "triage_rule"
triage_flagged_messages: true
default_actions: ["quarantine_message"]
source: |
  type.inbound
  and ml.attack_score().verdict == "malicious"
